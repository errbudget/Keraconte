name: build-release

# Construit le fat exec keraconte (onedir PyInstaller) pour Windows et Linux.
# PyInstaller ne cross-compile pas : chaque OS construit SON propre exécutable.
#
# Trois déclencheurs, un seul build :
#   - tag « v* »       → archives attachées à une Release GitHub ;
#   - branche « dev/** » → exe de DEV, en artefact seulement, aucune Release ;
#   - « workflow_dispatch » → à la main, sur n'importe quelle branche.
#
# La branche « dev/** » sert à essayer un correctif EN JEU sans poser de tag :
# le défaut de détection ne se reproduit que sur le flux réel (cf. la paire de
# fixtures Affreudite/hôtel de vente), et attendre une release pour l'éprouver
# coûtait un tag par essai. L'artefact reste attaché au run, jamais publié.
#
# macOS est hors ship (bloqueurs TCC/signature) : pas de job macOS ici.
# L'exe Linux suppose gi/GStreamer/PipeWire système (prérequis, non embarqués) ;
# l'exe Windows est autonome (backend mss, pur-Python).

on:
  push:
    tags: ["v*"]
    branches: ["dev/**"]
  workflow_dispatch:

permissions:
  contents: write  # nécessaire pour attacher les archives à la Release

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      # La spec lit ces variables pour localiser les ressources à embarquer.
      QR_VOICES: ${{ github.workspace }}/voices
      QR_TESSDATA: ${{ github.workspace }}/tessdata
      # Les deux voix du comportement par défaut (PNJ + narrateur).
      VOIX: "fr_FR-tom-medium fr_FR-siwis-medium"

    steps:
      - uses: actions/checkout@v4

      # Un exe de dev doit se DISTINGUER d'une release, sinon on teste en jeu
      # sans savoir lequel des deux on tient. Le nom d'artefact porte donc la
      # branche et le SHA court ; « ref_name » d'une branche « dev/x » contient
      # une barre oblique, interdite dans un nom d'artefact — on la remplace.
      - name: Étiquette du build
        id: etiquette
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "suffixe=" >> "$GITHUB_OUTPUT"
          else
            # La barre oblique de « dev/x » devient un tiret. Pas de « -dev- »
            # ajouté : le nom de branche le porte déjà, et le premier build
            # sortait « keraconte-Windows-dev-dev-detection-... ».
            branche="${GITHUB_REF_NAME//\//-}"
            echo "suffixe=-${branche}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --- Voix Piper par défaut (tom + siwis, .onnx + .onnx.json) ------------
      # Dépôt canonique rhasspy/piper-voices sur Hugging Face. La spec exige les
      # 4 fichiers dans QR_VOICES : sans siwis le narrateur d'actions serait muet.
      - name: Voix Piper (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$QR_VOICES"
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR"
          for v in $VOIX; do
            dataset="${v#fr_FR-}"; dataset="${dataset%-medium}"
            for ext in onnx onnx.json; do
              curl -fsSL -o "$QR_VOICES/$v.$ext" \
                "$base/$dataset/medium/$v.$ext?download=true"
            done
          done
          ls -la "$QR_VOICES"

      - name: Voix Piper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:QR_VOICES | Out-Null
          $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR"
          foreach ($v in $env:VOIX.Split(" ")) {
            $dataset = $v -replace "^fr_FR-","" -replace "-medium$",""
            foreach ($ext in @("onnx","onnx.json")) {
              Invoke-WebRequest -UseBasicParsing `
                -Uri "$base/$dataset/medium/$v.$ext`?download=true" `
                -OutFile "$env:QR_VOICES/$v.$ext"
            }
          }
          Get-ChildItem $env:QR_VOICES

      # --- tesseract + données « fra » (mêmes recettes que le workflow tests) --
      - name: tesseract + fra (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
          mkdir -p "$QR_TESSDATA"
          cp "$(dpkg -L tesseract-ocr-fra | grep fra.traineddata)" "$QR_TESSDATA/"
          cp "$(find /usr/share -name eng.traineddata | head -1)" "$QR_TESSDATA/" || true

      - name: tesseract + fra (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress -y tesseract
          # QR_TESSERACT DOIT pointer le vrai binaire (pas le shim choco) : la
          # spec l'exige et copie les DLL depuis son dossier d'install.
          $bin = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          if (-not (Test-Path $bin)) { throw "tesseract.exe introuvable : $bin" }
          "QR_TESSERACT=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path $env:QR_TESSDATA | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata" `
            -OutFile "$env:QR_TESSDATA/fra.traineddata"

      # --- Build ---------------------------------------------------------------
      - name: Installer le paquet + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: PyInstaller
        run: pyinstaller --clean --noconfirm packaging/keraconte.spec

      # --- Fumée : l'exe FIGÉ OCRise ET parle (les 2 voix) --------------------
      # Le seul signal automatique que le bundle n'est pas silencieusement muet
      # (espeak-ng-data absentes) ni OCR-mort (libs tesseract manquantes).
      - name: Smoke OCR + TTS (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          exe=./dist/keraconte/keraconte
          # OCR : le texte doit sortir (tesseract + tessdata + libs du bundle).
          ocr="$("$exe" --test tests/fixtures/dialogues/dialogue_brakmar.png)"
          echo "OCR: $ocr"
          case "$ocr" in *forgemage*) ;; *) echo "OCR muet/faux"; exit 1;; esac
          # TTS : la synthèse des 2 voix doit aboutir (espeak-ng-data du bundle).
          tts="$("$exe" --dire "Bonjour, *il acquiesce*, test.")"
          echo "TTS: $tts"
          case "$tts" in *"Synthèse OK"*) ;; *) echo "TTS muet"; exit 1;; esac

      - name: Smoke OCR + TTS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # PowerShell ne fait PAS échouer une étape sur un exit code natif :
          # on vérifie $LASTEXITCODE ET le contenu de sortie à chaque appel,
          # sinon un exe OCR-muet ou sans voix passerait en vert.
          $exe = ".\dist\keraconte\keraconte.exe"
          $ocr = & $exe --test tests/fixtures/dialogues/dialogue_brakmar.png
          Write-Host "OCR: $ocr"
          if ($LASTEXITCODE -ne 0) { throw "OCR exit $LASTEXITCODE" }
          if ($ocr -notmatch "forgemage") { throw "OCR muet/faux : $ocr" }
          $tts = & $exe --dire "Bonjour, *il acquiesce*, test."
          Write-Host "TTS: $tts"
          if ($LASTEXITCODE -ne 0) { throw "TTS exit $LASTEXITCODE" }
          if ($tts -notmatch "Synth") { throw "TTS muet : $tts" }

      # --- Archive + artefact --------------------------------------------------
      - name: Archiver le bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist -czf keraconte-linux-x64.tar.gz keraconte

      - name: Archiver le bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/keraconte -DestinationPath keraconte-windows-x64.zip

      - name: Uploader l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: keraconte-${{ runner.os }}${{ steps.etiquette.outputs.suffixe }}
          path: |
            keraconte-*.tar.gz
            keraconte-*.zip
          if-no-files-found: error
          # Un build de dev est jetable : on ne garde pas 90 jours d'essais.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

      # Sur tag « v* » : attacher les archives à la Release GitHub.
      - name: Attacher à la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            keraconte-*.tar.gz
            keraconte-*.zip

  # Annonce les exécutables dans la PR ouverte sur la branche.
  #
  # Un artefact GitHub ne s'atteint que par la page du run : sans ce lien, il
  # faut ouvrir l'onglet Actions et retrouver le bon build à la main. Le
  # commentaire est mis à jour en place à chaque poussée (« edit-mode:
  # replace ») plutôt qu'empilé, pour que la PR ne se remplisse pas d'annonces
  # périmées pointant vers des artefacts déjà expirés.
  #
  # Job séparé, et non une étape du build : la matrice tourne deux fois
  # (Windows et Linux), ce qui posterait deux commentaires concurrents.
  # « needs: build » attend en outre que les DEUX exécutables existent.
  annoncer:
    name: annoncer l'exe dans la PR
    needs: build
    # Jamais sur un tag : une release a sa page, elle n'a pas de PR.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Trouver la PR de la branche
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" --state open \
            --json number --jq '.[0].number // empty')
          echo "numero=$numero" >> "$GITHUB_OUTPUT"

      # Retrouve l'annonce précédente pour la remplacer plutôt qu'en empiler
      # une nouvelle. Le repère est le titre du commentaire, invariant d'un
      # build à l'autre ; l'auteur « github-actions[bot] » évite de toucher
      # à un commentaire humain qui contiendrait la même phrase.
      - name: Retrouver l'annonce précédente
        id: trouver
        uses: peter-evans/find-comment@v3
        if: steps.pr.outputs.numero != ''
        with:
          issue-number: ${{ steps.pr.outputs.numero }}
          comment-author: "github-actions[bot]"
          body-includes: "Exécutables de test"

      - name: Commenter la PR
        if: steps.pr.outputs.numero != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.numero }}
          comment-id: ${{ steps.trouver.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### Exécutables de test — `${{ github.sha }}`

            [**Télécharger depuis la page du run**](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)

            | plateforme | artefact |
            |---|---|
            | Windows | `keraconte-Windows-${{ github.ref_name }}` |
            | Linux | `keraconte-Linux-${{ github.ref_name }}` |

            Build de dev : aucune Release n'est publiée, et les artefacts
            expirent au bout de 14 jours. L'exe Linux suppose
            gi/GStreamer/PipeWire installés ; celui de Windows est autonome.
